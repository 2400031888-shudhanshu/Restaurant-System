<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Cart - Restaurant</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header>

    <h1>🍔 Online Restaurant</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="menu.html">Menu</a>

        <a href="cart.html">🛒 Cart</a>

        <a href="orders.html">My Orders</a>

    </nav>

</header>


<main>

    <h2>🛒 My Cart</h2>


    <!-- Loading message -->

    <div id="cart-loading">

        <p>Loading cart...</p>

    </div>


    <!-- Cart content -->

    <div id="cart-container"></div>


    <!-- Cart summary -->

    <div
        id="cart-summary"
        style="display: none;"
    >

        <h3>Order Summary</h3>

        <p>
            <strong>Total:</strong>
            ₹<span id="cart-total">0.00</span>
        </p>


        <button
            id="checkout-btn"
            onclick="checkout()"
        >
            Proceed to Checkout
        </button>

    </div>

</main>


<script src="js/common.js"></script>
<script src="js/cart.js"></script>

</body>

</html>
